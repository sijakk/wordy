<script>
/* 카카오톡·네이버·인스타 등 앱 안 브라우저에서 열면 사파리·크롬·삼성 인터넷으로 내보내요 (마이크·소리가 막히는 경우가 많아서) */
(function(){
  var ua=navigator.userAgent||'', url=location.href;
  if(/WordyApp/.test(ua)) return;
  var and=/Android/i.test(ua), ios=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&'ontouchend' in document);
  if(/KAKAOTALK/i.test(ua)){ location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(url); window.__INAPP='kakao'; }
  else if(/ Line\//i.test(ua)){ if(url.indexOf('openExternalBrowser=1')<0){ location.replace(url+(url.indexOf('?')<0?'?':'&')+'openExternalBrowser=1'); } window.__INAPP='line'; }
  else if(/NAVER\(inapp|NAVER\/|Instagram|FBAN|FBAV|FB_IAB|DaumApps|everytimeApp|BAND\/|Snapchat|Twitter|kakaostory/i.test(ua)){
    window.__INAPP='etc';
    if(and) location.href='intent://'+url.replace(/^https?:\/\//,'')+'#Intent;scheme=https;S.browser_fallback_url='+encodeURIComponent(url)+';end';
  }
  if(!window.__INAPP) return;
  // 자동으로 안 넘어가면 안내 화면
  window.addEventListener('DOMContentLoaded',function(){ setTimeout(function(){
    var host=url.replace(/^https?:\/\//,''), d=document.createElement('div'); d.className='escape';
    var btns=and?
      '<a class="eb" href="intent://'+host+'#Intent;scheme=https;package=com.android.chrome;end">크롬으로 열기</a>'+
      '<a class="eb alt" href="intent://'+host+'#Intent;scheme=https;package=com.sec.android.app.sbrowser;end">삼성 인터넷으로 열기</a>'
      :(window.__INAPP==='kakao'?'<a class="eb" href="kakaotalk://web/openExternal?url='+encodeURIComponent(url)+'">사파리로 열기</a>':'<a class="eb" href="x-safari-'+url+'">사파리로 열기</a>');
    d.innerHTML='<div class="ebox"><div style="font-size:46px">🐻</div><h2>브라우저에서 열어 주세요</h2>'+
      '<p>지금 화면은 '+(window.__INAPP==='kakao'?'카카오톡':'앱')+' 안이라 마이크와 소리가 잘 안 될 수 있어요.<br>'+(and?'크롬이나 삼성 인터넷':'사파리')+'에서 열면 워디를 제대로 쓸 수 있어요.</p>'+btns+
      '<button class="eb ghost" id="ecopy">링크 복사하기</button>'+
      '<p class="small">버튼이 안 되면 화면 '+(ios?'아래':'위')+' <b>⋯</b> 또는 <b>⋮</b> 메뉴 → <b>'+(ios?'Safari로 열기':'다른 브라우저로 열기')+'</b>를 눌러 주세요.</p>'+
      '<button class="eb link" id="estay">그냥 여기서 볼게요</button></div>';
    document.body.appendChild(d);
    document.getElementById('estay').onclick=function(){ d.remove(); };
    document.getElementById('ecopy').onclick=function(){ var b=this; function ok(){ b.textContent='복사했어요 ✓ 브라우저 주소창에 붙여 넣어 주세요'; }
      try{ navigator.clipboard.writeText(url).then(ok,function(){ fb(); }); }catch(e){ fb(); }
      function fb(){ var t=document.createElement('textarea'); t.value=url; document.body.appendChild(t); t.select(); try{document.execCommand('copy'); ok();}catch(e){} t.remove(); } };
  },1200); });
})();
</script>
<meta name="theme-color" content="#F3F7FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="워디">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>워디</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F7FF; --ink:#14213D; --ink2:#44506B; --muted:#8391A8; --line:#E1E8F4;
  --coral:#2F6BFF; --coral2:#5B8CFF; --coral-soft:#E2EBFF; --mint:#22B39C; --mint-soft:#DDF5F0;
  --violet:#0EA5E9; --violet-soft:#DFF3FC; --yellow:#FFC83D; --red:#EF4B4B; --card:#fff;
  --r:22px; --shadow:0 6px 24px rgba(20,45,100,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);background:#E3EAF6;display:flex;justify-content:center;align-items:center}
.en{font-family:'Outfit','Noto Sans KR',sans-serif}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.app{position:relative;width:100%;max-width:420px;height:100dvh;max-height:880px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media(min-width:500px){.app{border-radius:36px;box-shadow:0 30px 80px rgba(15,35,90,.2);height:92dvh}}
#screen{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
#screen::-webkit-scrollbar{width:0}
.pad{padding:20px 20px 28px}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Tab bar */
.tabbar{display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--line);padding:8px 6px calc(10px + env(safe-area-inset-bottom))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-weight:500;padding:4px 10px;border-radius:12px}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--coral);font-weight:700}
.hidden{display:none!important}

/* Common */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:18px;font-weight:700;font-size:16px;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--coral);color:#fff;box-shadow:0 8px 20px rgba(47,107,255,.35)}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:transparent;color:var(--ink2)}
.btn-soft{background:var(--coral-soft);color:var(--coral)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.top{display:flex;align-items:center;gap:10px;padding:16px 16px 6px}
.top h2{font-size:18px;font-weight:800;flex:1}
.iconbtn{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:#fff;box-shadow:var(--shadow);flex-shrink:0}
.iconbtn svg{width:22px;height:22px}
.chip{padding:8px 14px;border-radius:99px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 10px}
.chips::-webkit-scrollbar{display:none}
.label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;width:max-content;max-width:86%;text-align:center;z-index:50;line-height:1.45}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal-bg{position:absolute;inset:0;background:rgba(20,15,30,.45);display:flex;align-items:flex-end;z-index:40;animation:fade .2s}
.modal{background:#fff;width:100%;border-radius:28px 28px 0 0;padding:26px 22px calc(22px + env(safe-area-inset-bottom))}
.modal h3{font-size:19px;margin-bottom:8px}
.modal p{color:var(--ink2);font-size:14.5px;line-height:1.6;margin-bottom:20px}

/* Splash */
.splash{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#5B8CFF 0%,#2F6BFF 45%,#1C4ED8 100%);color:#fff;text-align:center;padding:30px}
.splash .mascot{width:124px;animation:pop .8s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.3) rotate(-15deg);opacity:0}to{transform:none;opacity:1}}
.splash .logo{font-size:52px;font-weight:900;letter-spacing:.04em;margin-top:18px;animation:fade .6s .3s both}
.splash .sub{font-size:15px;opacity:.9;margin-top:4px;font-weight:600;letter-spacing:.06em;animation:fade .6s .45s both}
.splash .slogan{position:absolute;bottom:60px;left:0;right:0;font-size:15px;font-weight:500;opacity:.95;animation:fade .6s .7s both}
.dots-load{display:flex;gap:6px;justify-content:center;margin-top:30px;animation:fade .5s .8s both}
.dots-load i{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.5;animation:blink 1s infinite}
.dots-load i:nth-child(2){animation-delay:.15s}.dots-load i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:1;transform:translateY(-4px)}}

/* Onboarding */
.onb{height:100%;display:flex;flex-direction:column;padding:20px 24px 28px}
.onb .skip{align-self:flex-end;color:var(--muted);font-size:14px;font-weight:600;padding:6px}
.onb .art{flex:1;display:flex;align-items:center;justify-content:center}
.onb .art .circle{width:250px;height:250px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.onb h1{font-size:26px;line-height:1.35;font-weight:900;margin-bottom:10px;letter-spacing:-.02em}
.onb p{color:var(--ink2);font-size:15px;line-height:1.6;margin-bottom:26px}
.pager{display:flex;gap:6px;margin-bottom:22px}
.pager i{height:8px;width:8px;border-radius:9px;background:var(--line);transition:.3s}
.pager i.on{width:24px;background:var(--coral)}
.field{width:100%;padding:16px 18px;border-radius:16px;border:2px solid var(--line);background:#fff;font-size:16px;outline:none}
.field:focus{border-color:var(--coral)}

/* Home */
.hello{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.hello .t{flex:1}
.hello .t small{color:var(--muted);font-size:13px}
.hello .t b{display:block;font-size:21px;font-weight:900;letter-spacing:-.02em}
.streak{display:flex;align-items:center;gap:4px;background:#fff;padding:8px 12px;border-radius:14px;font-weight:800;box-shadow:var(--shadow);font-size:14px}
.hero{background:linear-gradient(135deg,#1C3A8C,#12245E);color:#fff;border-radius:26px;padding:20px;display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero:after{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero .info{flex:1;z-index:1}
.hero .info small{opacity:.65;font-size:12px}
.hero .info b{display:block;font-size:24px;font-weight:900;margin:2px 0 10px}
.bar{height:8px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--yellow);border-radius:9px;transition:width .5s}
.hero .goal{font-size:12px;opacity:.8;margin-top:6px}
.hero .goal b{display:inline;font-size:inherit;margin:0;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.menu{border-radius:24px;padding:18px 16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:150px;position:relative;overflow:hidden;transition:transform .12s}
.menu:active{transform:scale(.97)}
.menu .ic{width:46px;height:46px;border-radius:15px;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center}
.menu .ic svg{width:26px;height:26px}
.menu b{font-size:16px;font-weight:800;margin-top:auto}
.menu small{font-size:12px;color:var(--ink2);line-height:1.4}
.menu.wide{grid-column:span 2;min-height:auto;flex-direction:row;align-items:center}
.menu.wide .tx{flex:1;display:flex;flex-direction:column;gap:3px}
.menu.wide b{margin-top:0}
.sec-title{font-size:16px;font-weight:800;margin:24px 0 10px;display:flex;justify-content:space-between;align-items:center}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border-radius:18px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;font-weight:900}
.stat small{font-size:11.5px;color:var(--muted)}

/* Level test */
.progress{height:10px;background:var(--line);border-radius:9px;overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:var(--coral);border-radius:9px;transition:width .4s}
.q-wrap{padding:16px 20px 28px}
.q-kind{display:inline-block;font-size:12px;font-weight:700;padding:6px 10px;border-radius:9px;background:var(--violet-soft);color:var(--violet);margin-bottom:14px}
.q-text{font-size:21px;font-weight:800;line-height:1.5;margin-bottom:24px;letter-spacing:-.01em}
.q-text .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--coral);margin:0 4px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 18px;text-align:left;font-size:16px;font-weight:600;display:flex;gap:12px;align-items:center;transition:.15s}
.opt .n{width:28px;height:28px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--muted);flex-shrink:0}
.opt.ok{border-color:var(--mint);background:var(--mint-soft)}
.opt.ok .n{background:var(--mint);color:#fff}
.opt.no{border-color:var(--red);background:#FDECEC}
.opt.no .n{background:var(--red);color:#fff}
.listen-big{width:120px;height:120px;border-radius:50%;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;margin:6px auto 26px;box-shadow:0 12px 30px rgba(47,107,255,.4)}
.listen-big svg{width:50px;height:50px}
.listen-big.playing{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 16px rgba(47,107,255,.15)}}

/* Tier */
.tier-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.tier-item{background:#fff;border-radius:16px;padding:12px 6px;text-align:center;font-size:12px;font-weight:700;color:var(--ink2);opacity:.5}
.tier-item.me{opacity:1;box-shadow:0 0 0 2px var(--coral)}
.result{text-align:center;padding:30px 24px}
.result .emb{animation:pop .9s cubic-bezier(.2,1.6,.4,1) both;display:inline-block}
.result h1{font-size:34px;font-weight:900;margin-top:10px}
.result .score{display:flex;justify-content:center;gap:10px;margin:18px 0}

/* Study */
.study{padding:4px 20px 28px}
.wcard{background:#fff;border-radius:28px;padding:24px 22px;box-shadow:var(--shadow);text-align:center;position:relative}
.wcard .count{position:absolute;top:18px;left:20px;font-size:12px;font-weight:700;color:var(--muted)}
.wcard .known{position:absolute;top:14px;right:14px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:10px;background:var(--bg);color:var(--muted)}
.wcard .known.on{background:var(--mint-soft);color:var(--mint)}
.wcard .word{font-size:40px;font-weight:900;margin-top:20px;letter-spacing:-.01em;word-break:break-word}
.wcard .sent{font-size:23px;font-weight:800;margin-top:26px;line-height:1.45}
.wcard .ipa{color:var(--muted);font-size:15px;margin-top:4px}
.pos{display:inline-block;font-size:12px;font-weight:700;color:var(--violet);background:var(--violet-soft);padding:3px 8px;border-radius:7px;margin-right:6px}
.meaning{margin-top:14px;font-size:18px;font-weight:700;cursor:pointer;transition:filter .2s}
.meaning.blur{filter:blur(7px);user-select:none}
.ex{margin-top:18px;background:var(--bg);border-radius:16px;padding:14px;text-align:left;font-size:14.5px;line-height:1.55}
.ex .e{font-weight:600}
.ex .k{color:var(--muted);font-size:13px;margin-top:2px}
.play-row{display:flex;gap:10px;justify-content:center;margin-top:18px}
.pbtn{display:flex;align-items:center;gap:6px;padding:11px 16px;border-radius:14px;background:var(--coral-soft);color:var(--coral);font-weight:700;font-size:14px}
.pbtn svg{width:18px;height:18px}
.pbtn.alt{background:var(--violet-soft);color:var(--violet)}
.speak-zone{margin-top:16px;background:#fff;border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.mic-row{display:flex;align-items:center;gap:14px}
.mic{width:64px;height:64px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
.mic svg{width:28px;height:28px}
.mic.on{background:var(--red);animation:pulse2 1.1s infinite}
.mic.off{background:#C9C4D2}
.mic.nudge{background:var(--coral);animation:nudge 1.2s infinite}
@keyframes nudge{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(47,107,255,.45)}50%{transform:scale(1.08);box-shadow:0 0 0 14px rgba(47,107,255,0)}}
@keyframes pulse2{50%{box-shadow:0 0 0 12px rgba(239,75,75,.18)}}
.mic-tx{flex:1;font-size:14px;color:var(--ink2);line-height:1.45}
.mic-tx b{display:block;color:var(--ink);font-size:15px}
.live{font-style:italic;color:var(--violet)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:14px 0 10px}
.or:before,.or:after{content:'';flex:1;height:1px;background:var(--line)}
.type-row{display:flex;gap:8px}
.type-row input{flex:1;padding:13px 14px;border-radius:14px;border:2px solid var(--line);outline:none;font-size:15px;min-width:0}
.type-row input:focus{border-color:var(--coral)}
.type-row button{padding:0 16px;border-radius:14px;background:var(--coral);color:#fff;font-weight:700;font-size:14px}
.float-score{position:absolute;left:50%;top:52px;transform:translate(-50%,0);z-index:5;min-width:180px;padding:14px 22px 12px;border-radius:24px;text-align:center;box-shadow:0 14px 36px rgba(20,45,100,.22);animation:floatIn .5s cubic-bezier(.2,1.5,.4,1) both;pointer-events:none}
.float-score .n{font:900 46px/1 Outfit}
.float-score .t{font-weight:800;font-size:14px;margin-top:4px}
.float-score .s{font-size:12px;opacity:.8;margin-top:3px}
.float-score.good{background:#fff;color:var(--mint);border:3px solid var(--mint)}
.float-score.mid{background:#fff;color:#D99A00;border:3px solid #FFC83D}
.float-score.bad{background:#fff;color:var(--red);border:3px solid var(--red)}
.float-score.out{animation:floatOut .4s ease forwards}
@keyframes floatIn{from{opacity:0;transform:translate(-50%,24px) scale(.6)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes floatOut{to{opacity:0;transform:translate(-50%,-30px) scale(.9)}}
.review-bar{display:flex;align-items:center;gap:8px;margin:-2px 0 12px;padding:10px 12px;border-radius:16px;background:linear-gradient(135deg,#E2EBFF,#DFF3FC);font-size:12.5px;line-height:1.4}
.review-bar span{flex:1}
.review-bar button{background:var(--coral);color:#fff;border-radius:12px;padding:8px 12px;font-weight:800;font-size:12.5px;white-space:nowrap}
.review-bar.on{background:#FFF3D6}
.review-bar.on button{background:#fff;color:var(--ink2);box-shadow:var(--shadow)}
.day-prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);margin:0 0 10px}
.day-prog .bar{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.day-prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),#0EA5E9);border-radius:6px}
.res{margin-top:14px;border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:center;animation:fade .3s}
.res .sc{font-family:'Outfit';font-size:30px;font-weight:900;min-width:64px;text-align:center}
.res .msg{flex:1;font-size:13.5px;line-height:1.5}
.res .msg b{font-size:15px;display:block}
.res.good{background:var(--mint-soft)} .res.good .sc{color:var(--mint)}
.res.mid{background:#FFF3D6} .res.mid .sc{color:#D99A00}
.res.bad{background:#FDECEC} .res.bad .sc{color:var(--red)}
.hl-ok{color:var(--mint)} .hl-miss{color:var(--red);text-decoration:underline wavy;text-underline-offset:4px}
.nav-row{display:flex;gap:10px;margin-top:16px}
.navar{position:absolute;top:62px;width:40px;height:40px;border-radius:50%;background:var(--bg);color:var(--coral);font:900 28px/1 Outfit;display:flex;align-items:center;justify-content:center;padding-bottom:3px;z-index:2;box-shadow:0 2px 0 var(--line)}
.navar:active{transform:scale(.9);background:var(--coral-soft)}
.navar.l{left:10px}.navar.r{right:10px}
.points-hero{background:linear-gradient(135deg,#2F6BFF,#0EA5E9);color:#fff;border-radius:26px;padding:22px;position:relative;overflow:hidden}
.points-hero b{font:900 40px Outfit;display:block;margin-top:4px}
.addots{display:flex;gap:5px;margin:12px 0 4px}
.addots i{flex:1;height:8px;border-radius:5px;background:var(--line)}
.addots i.on{background:var(--yellow)}
.ad-bg{position:absolute;inset:0;background:#0B1020;z-index:60;display:flex;flex-direction:column;color:#fff;animation:fade .2s}
.ad-top{display:flex;align-items:center;justify-content:space-between;padding:16px}
.ad-top span{font-size:12px;font-weight:700;background:rgba(255,255,255,.15);padding:6px 10px;border-radius:9px}
.ad-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.ad-bar{height:4px;background:rgba(255,255,255,.15)}
.ad-bar i{display:block;height:100%;background:var(--yellow);width:0;transition:width linear}
.sec-h{font-size:13px;font-weight:800;color:var(--ink2);padding:6px 20px 0;display:flex;justify-content:space-between}
.nav-row .btn{padding:14px}

/* Conversation */
.topics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.topic{background:#fff;border-radius:18px;padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:700;box-shadow:var(--shadow);transition:transform .1s}
.topic:active{transform:scale(.95)}
.topic .em{font-size:26px}
.random{background:linear-gradient(135deg,#2F6BFF,#0EA5E9);color:#fff;border-radius:22px;padding:18px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-bottom:16px;box-shadow:0 10px 24px rgba(47,107,255,.3)}
.random .em{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:24px}
.random b{font-size:16px;display:block}
.random small{opacity:.85;font-size:12.5px}
.chat-wrap{display:flex;flex-direction:column;height:100%}
.chat-head{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
.chat-head .tt{flex:1;min-width:0}
.chat-head .tt b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .tt small{font-size:12px;color:var(--muted)}
.toggle{font-size:12px;font-weight:700;padding:7px 10px;border-radius:10px;background:#fff;color:var(--muted);border:1.5px solid var(--line);white-space:nowrap}
.toggle.on{background:var(--coral-soft);color:var(--coral);border-color:var(--coral-soft)}
.msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.msg-row{display:flex;gap:8px;align-items:flex-end;max-width:100%}
.msg-row.me{flex-direction:row-reverse}
.av{width:34px;height:34px;flex-shrink:0}
.bub{max-width:78%;padding:12px 14px;border-radius:20px;font-size:15px;line-height:1.5;word-break:break-word}
.bot .bub{background:#fff;border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.me .bub{background:var(--coral);color:#fff;border-bottom-right-radius:6px}
.bub .tools{display:flex;gap:6px;margin-top:8px}
.bub .tools button{font-size:12px;font-weight:700;padding:5px 9px;border-radius:9px;background:var(--bg);color:var(--ink2);display:flex;align-items:center;gap:4px}
.bub .tools svg{width:14px;height:14px}
.bub .ko{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--ink2)}
.fb{align-self:flex-end;max-width:84%;background:#fff;border:1.5px solid var(--mint-soft);border-radius:16px;padding:10px 12px;font-size:13px;line-height:1.5;margin-top:-4px}
.fb .h{font-weight:800;color:var(--mint);font-size:12px;margin-bottom:3px}
.fb .better{font-weight:700;color:var(--ink);margin-top:4px;display:flex;gap:6px;align-items:flex-start}
.fb .better button{flex-shrink:0;color:var(--coral)}
.fb .better svg{width:16px;height:16px}
.typing .bub{display:flex;gap:4px;padding:16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;border:2px solid var(--line);border-radius:18px;padding:11px 14px;font-size:15px;outline:none;max-height:110px;min-height:46px;line-height:1.4}
.composer textarea:focus{border-color:var(--coral)}
.cbtn{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cbtn svg{width:22px;height:22px}
.cbtn.mic2{background:var(--ink);color:#fff}
.cbtn.mic2.on{background:var(--red);animation:pulse2 1.1s infinite}
.cbtn.send{background:var(--coral);color:#fff}
.cbtn:disabled{opacity:.4}
.hint-line{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 0}
.badge-off{font-size:11px;background:#FFF3D6;color:#B07A00;padding:2px 7px;border-radius:6px;font-weight:700;margin-left:4px}

/* Segmented */
.seg{display:flex;background:#fff;border-radius:14px;padding:4px;box-shadow:var(--shadow);width:170px}
.seg button{flex:1;padding:8px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--coral);color:#fff}
/* Games */
.gcard{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border-radius:24px;padding:18px;margin-bottom:12px;transition:transform .12s;position:relative;overflow:hidden}
.gcard:active{transform:scale(.97)}
.gcard b{font-size:17px;display:block;margin-bottom:3px}
.gcard small{font-size:12.5px;line-height:1.45;opacity:.85}
.gcard .best{position:absolute;top:12px;right:14px;font-size:11px;font-weight:800;background:rgba(255,255,255,.75);padding:4px 8px;border-radius:8px}
.gico{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ghead{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.gscore{font-family:Outfit;font-weight:900;font-size:18px;background:#fff;padding:7px 12px;border-radius:12px;box-shadow:var(--shadow)}
.gq{background:#fff;border-radius:24px;padding:20px;text-align:center;box-shadow:var(--shadow);margin:6px 20px 0}
.gq .ko{font-size:24px;font-weight:900;margin:6px 0 4px}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:22px 20px 18px}
.slot{width:42px;height:50px;border-radius:12px;border:2.5px dashed #C7D3EA;background:#fff;font:900 24px Outfit;display:flex;align-items:center;justify-content:center;text-transform:uppercase;color:var(--ink)}
.slots.sm .slot{width:32px;height:42px;font-size:19px;border-radius:10px}
.slot.f{border-style:solid;border-color:var(--coral);color:var(--coral)}
.slot.lock{background:var(--coral-soft);border-style:solid;border-color:var(--coral-soft)}
.slots.ok .slot{border-color:var(--mint);background:var(--mint-soft);color:var(--mint)}
.blocks{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:0 20px}
.blk{width:50px;height:54px;border-radius:15px;font:900 25px Outfit;color:#fff;text-transform:uppercase;box-shadow:0 6px 0 rgba(0,0,0,.2),inset 0 -3px 0 rgba(0,0,0,.08);transition:.12s}
.blk:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
.blk.used{opacity:.18;transform:translateY(5px);box-shadow:none;pointer-events:none}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.gbtns{display:flex;gap:10px;padding:22px 20px 26px}
.gbtns .btn{padding:13px;font-size:14.5px}
.ws{display:grid;gap:4px;touch-action:none;user-select:none;-webkit-user-select:none;margin:6px 16px 0;background:#fff;padding:8px;border-radius:20px;box-shadow:var(--shadow)}
.ws div{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font:800 18px Outfit;text-transform:uppercase;color:var(--ink2);transition:background .12s}
.ws div.sel{background:var(--coral);color:#fff;transform:scale(1.05)}
.ws div.anchor{box-shadow:0 0 0 2.5px var(--coral) inset}
.wlist{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px 26px}
.wchip{padding:8px 12px;border-radius:12px;background:#fff;box-shadow:var(--shadow);font-size:13px;line-height:1.3}
.wchip b{font-family:Outfit;text-transform:uppercase;letter-spacing:.05em;display:block}
.wchip small{color:var(--muted)}
.wchip.done{opacity:.55;text-decoration:line-through}
.tbar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:0 20px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#0EA5E9,#2F6BFF);transition:width 1s linear}
/* Closet */
.stage{margin:4px 20px 0;border-radius:30px;background:radial-gradient(circle at 50% 45%,#fff 0%,#E2EBFF 70%);padding:18px 10px 12px;text-align:center;position:relative}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 20px 28px}
.item{background:#fff;border-radius:18px;padding:8px 4px 10px;text-align:center;box-shadow:var(--shadow);border:2.5px solid transparent;position:relative;font-size:12px;font-weight:700}
.item.on{border-color:var(--coral);background:var(--coral-soft)}
.item.lock{opacity:.55}
.item.lock svg{filter:grayscale(1)}
.item.lock.shop{opacity:1}.item.lock.shop svg{filter:none;opacity:.9}
.item .cond{font-size:10.5px;color:var(--muted);font-weight:600;display:block;margin-top:2px}
.item .lk{position:absolute;top:6px;right:8px;font-size:13px}
/* Profile */
.prof-head{text-align:center;padding:10px 0 6px}
.prof-head h2{font-size:22px;font-weight:900;margin-top:8px}
.list{background:#fff;border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.list button{display:flex;width:100%;padding:16px 18px;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;border-bottom:1px solid var(--line);text-align:left}
.list button:last-child{border-bottom:none}
.list button span{color:var(--muted);font-size:13px}

/* ===== 워디 챌린지 추가 스타일 (기존 워디 디자인 토큰 그대로) ===== */
.today{background:#fff;border-radius:26px;padding:20px;box-shadow:var(--shadow);margin-top:14px;position:relative;overflow:hidden}
.today .lab{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--coral);background:var(--coral-soft);padding:5px 10px;border-radius:9px}
.today h3{font-size:21px;font-weight:900;letter-spacing:-.02em;margin:10px 0 4px;line-height:1.35}
.today p{font-size:13px;color:var(--ink2);line-height:1.5}
.today .bear{position:absolute;right:-6px;top:10px;opacity:.95}
.kinds{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 16px}
.kinds span{font-size:11.5px;font-weight:700;color:var(--ink2);background:var(--bg);padding:5px 9px;border-radius:8px}
.cost{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.22);padding:3px 9px;border-radius:9px;font-weight:800;font-size:13px}
.xpbar{height:8px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#5B8CFF,#9DE0FF);border-radius:9px;transition:width .5s}
.lockcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.lockcard .tx{flex:1;font-size:13px;line-height:1.5;color:var(--ink2)}
.lockcard .tx b{color:var(--ink);font-size:15px;display:block}
.minibar{height:7px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:6px}
.minibar i{display:block;height:100%;background:linear-gradient(90deg,var(--coral),#0EA5E9);border-radius:6px}

/* 학습 지도 */
.sec-card{margin:4px 20px 0;border-radius:24px;padding:18px;background:linear-gradient(135deg,#1C3A8C,#12245E);color:#fff;display:flex;gap:14px;align-items:center}
.sec-card small{opacity:.7;font-size:12px}
.sec-card b{display:block;font-size:19px;font-weight:900;margin-top:2px}
.path{padding:14px 20px 34px;position:relative}
.path:before{content:'';position:absolute;left:50%;top:40px;bottom:60px;width:6px;margin-left:-3px;background:repeating-linear-gradient(#D5DFF2 0 12px,transparent 12px 22px);border-radius:3px}
.nrow{display:flex;justify-content:center;margin:0 0 18px;position:relative}
.node{display:flex;flex-direction:column;align-items:center;gap:6px;width:150px}
.nb{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:900 22px Outfit;color:#fff;background:#C9D3E6;box-shadow:0 6px 0 #AEB9CF;position:relative;transition:transform .12s}
.node:active .nb{transform:translateY(3px)}
.nb svg{width:28px;height:28px}
.node.done .nb{background:var(--mint);box-shadow:0 6px 0 #178C79}
.node.open .nb,.node.pay .nb{background:var(--coral);box-shadow:0 6px 0 #1E4FD0;animation:nudge 1.6s infinite}
.node.tomorrow .nb{background:#fff;color:var(--muted);box-shadow:0 6px 0 var(--line);border:3px dashed #C7D3EA}
.node .nt{font-size:12.5px;font-weight:800;text-align:center;line-height:1.35;background:var(--bg);padding:2px 6px;border-radius:8px}
.node .ns{font-size:11px;color:var(--muted);font-weight:700;margin-top:-4px}
.node.open .ns,.node.pay .ns{color:var(--coral)}
.badge{position:absolute;top:-6px;right:-8px;background:var(--yellow);color:var(--ink);font:800 11px 'Noto Sans KR';padding:3px 7px;border-radius:9px;box-shadow:0 2px 6px rgba(0,0,0,.12)}

/* 레벨 플레이 */
.play{height:100%;display:flex;flex-direction:column;position:relative}
.ptop{display:flex;align-items:center;gap:12px;padding:16px 16px 6px}
.ptop .cnt{font:800 14px Outfit;color:var(--muted);min-width:42px;text-align:right}
.pbody{flex:1;overflow-y:auto;padding:10px 20px 16px}
.pfoot{padding:12px 20px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(rgba(243,247,255,0),var(--bg) 30%)}
.akind{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:6px 10px;border-radius:9px;background:var(--violet-soft);color:var(--violet)}
.aq{font-size:20px;font-weight:900;line-height:1.45;margin:12px 0 18px;letter-spacing:-.02em}
.picbox{width:180px;height:180px;margin:0 auto 22px;border-radius:40px;background:#fff;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:96px;line-height:1}
.scene{display:flex;gap:14px;align-items:center;background:#fff;border-radius:24px;padding:16px;box-shadow:var(--shadow);margin-bottom:18px}
.scene .em{width:74px;height:74px;border-radius:22px;background:var(--coral-soft);display:flex;align-items:center;justify-content:center;font-size:42px;flex-shrink:0}
.scene p{font-size:16px;font-weight:700;line-height:1.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt.en{font-family:'Outfit','Noto Sans KR';font-size:18px;justify-content:center;font-weight:800}
.optE{background:#fff;border:2px solid var(--line);border-radius:22px;font-size:58px;height:110px;display:flex;align-items:center;justify-content:center;transition:.15s}
.optE.ok{border-color:var(--mint);background:var(--mint-soft)}
.optE.no{border-color:var(--red);background:#FDECEC}
.opt:disabled,.optE:disabled{cursor:default}
.listen-big{width:110px;height:110px;margin:4px auto 18px}
.say-card{background:#fff;border-radius:28px;padding:26px 20px 22px;box-shadow:var(--shadow);text-align:center}
.say-card .em{font-size:64px;line-height:1}
.say-card .w{font:900 40px/1.15 Outfit;margin-top:10px;word-break:break-word}
.say-card .s{font:800 24px/1.4 Outfit;margin-top:4px}
.say-card .k{color:var(--ink2);font-size:15px;font-weight:600;margin-top:10px}
.say-card .play-row{margin-top:18px}
.ans{min-height:64px;border-bottom:2.5px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:6px 0 12px;margin-bottom:18px}
.ans.ok .tile{background:var(--mint-soft);border-color:var(--mint);color:#13806E}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:10px 14px;font:700 17px Outfit;color:var(--ink);transition:.12s}
.tile:active{transform:translateY(2px)}
.tile.used{visibility:hidden}
.tile.right{border-color:var(--mint);background:var(--mint-soft)}
.kohint{text-align:center;font-size:15px;color:var(--ink2);font-weight:600;margin:-6px 0 14px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pairs .col{display:flex;flex-direction:column;gap:10px}
.pt{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;min-height:58px;padding:10px;font-weight:800;font-size:16px;transition:.15s}
.pt.en{font-family:'Outfit','Noto Sans KR';font-size:18px}
.pt.sel{border-color:var(--coral);background:var(--coral-soft);color:var(--coral)}
.pt.done{border-color:var(--mint-soft);background:var(--mint-soft);color:var(--mint);opacity:.55;pointer-events:none}
.pt.bad{border-color:var(--red);background:#FDECEC}
.footrow{display:flex;gap:10px}
.btn:disabled{opacity:.45;box-shadow:none}

/* 마이크 (심플) */
.micwrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.mic-live{min-height:22px;font-size:14px;color:var(--ink2);text-align:center;line-height:1.45;max-width:320px}
.mic-live .said{font-family:Outfit;font-weight:700;color:var(--violet)}
.mic.big{width:76px;height:76px;background:var(--coral);box-shadow:0 10px 24px rgba(47,107,255,.35)}
.mic.big svg{width:32px;height:32px}
.mic.big.on{background:var(--red);box-shadow:0 10px 24px rgba(239,75,75,.35)}
.mic-sub{font-size:12px;color:var(--muted);font-weight:700;min-height:16px}
.linkbtn{font-size:13px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:4px 8px}

/* CLEAR 점수판 */
.clear-board{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:30;min-width:210px;padding:18px 26px 16px;border-radius:28px;text-align:center;background:#fff;border:3px solid var(--mint);color:var(--mint);box-shadow:0 18px 40px rgba(20,45,100,.25);animation:cbIn .45s cubic-bezier(.2,1.5,.4,1) both;pointer-events:none}
.clear-board .n{font:900 44px/1 Outfit;letter-spacing:.03em}
.clear-board .s{font-size:13px;font-weight:700;margin-top:6px;color:var(--ink2)}
.clear-board.soft{border-color:#FFC83D;color:#D99A00}
.clear-board.bad{border-color:var(--red);color:var(--red)}
.clear-board.out{animation:cbOut .35s ease forwards}
@keyframes cbIn{from{opacity:0;transform:translate(-50%,-30%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes cbOut{to{opacity:0;transform:translate(-50%,-70%) scale(.9)}}

/* 힌트 창 */
.hint-em{font-size:54px;text-align:center;line-height:1}
.hint-t{text-align:center;font-size:21px;font-weight:900;margin:8px 0 6px}
.hint-t.sim{color:#D99A00}.hint-t.diff{color:var(--red)}
.hint-box{background:var(--bg);border-radius:16px;padding:14px;font-size:14px;line-height:1.6;color:var(--ink2);margin-bottom:16px}
.hint-box b{color:var(--ink)}
.hint-box .en{font-weight:700;color:var(--coral)}

/* 광고 */
.ad-cta{margin-top:26px;max-width:290px}
.adweb{position:absolute;inset:0;background:#fff;z-index:70;display:flex;flex-direction:column;animation:fade .2s}
.adweb .bar{height:auto;background:#F1F3F7;border-radius:0;display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:13px;color:var(--ink2);overflow:visible}

.steps{display:flex;flex-direction:column;gap:8px;margin:12px 0 14px}
.steps div{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink2)}
.steps i{font-style:normal;width:24px;height:24px;border-radius:8px;background:var(--coral-soft);color:var(--coral);font:800 13px Outfit;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tierrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.tierrow:last-child{border-bottom:none}
.tierrow .tx{flex:1;font-size:13px;color:var(--ink2);line-height:1.45}
.tierrow .tx b{display:block;color:var(--ink);font-size:15px}
.tierrow.me{background:var(--coral-soft);border-radius:14px;padding:8px 10px;border-bottom:none}
.modal{max-height:88%;overflow-y:auto}
.res-big{text-align:center;padding:34px 24px}
.res-big h1{font-size:30px;font-weight:900;margin-top:12px;letter-spacing:-.02em}
.res-big p{color:var(--ink2);font-size:14.5px;line-height:1.6;margin-top:8px}
.res-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}

/* 문제마다 워디 */
.bw{position:relative;flex-shrink:0;border-radius:24px;background:radial-gradient(circle at 50% 45%,#fff 0%,var(--coral-soft) 75%);display:flex;align-items:flex-end;justify-content:center}
.bw svg{display:block}
.bw .prop{position:absolute;right:-8px;bottom:-4px;width:46%;height:46%;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(20,45,100,.15);display:flex;align-items:center;justify-content:center;line-height:1}
.scene{padding:14px 16px 14px 14px}
.listen-row{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 18px}
.listen-row .listen-big{margin:0}
.picbox{position:relative}
.picbox .peek{position:absolute;left:-58px;bottom:-14px}
.say-card .bw{margin-bottom:4px}

button{touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pt,.opt,.optE,.tile,.blk{transition:transform .06s,background .08s,border-color .08s}
.pt:active,.opt:active,.optE:active,.tile:active{transform:scale(.96)}

.pt:active,.opt:active,.optE:active,.tile:active{transform:scale(.96)}
.pt,.opt,.optE,.tile,.blk{transition:transform .06s,background .1s,border-color .1s}

.tierbar b{font-size:14.5px;font-weight:800}
.tierbar small{font-size:11.5px;opacity:.75}
.tierbar .chev{font-size:24px;opacity:.6}
.mini2{display:block;height:6px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden}

.nopen{margin-top:12px;text-align:center;font-size:12px;color:var(--coral);font-weight:700}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

.quick .qi{font-size:26px;line-height:1.1}
.quick b{font-size:12px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}

.pcard .tx{flex:1;display:flex;flex-direction:column;gap:4px}

.pcard small{font-size:12.5px;color:var(--ink2);line-height:1.45}

.list a{display:flex;width:100%;padding:16px 18px;justify-content:space-between;align-items:center;font-size:15px;font-weight:600;border-bottom:1px solid var(--line);text-align:left;color:var(--ink);text-decoration:none}

.qbig b{font-size:16px;font-weight:800;letter-spacing:-.02em}
.qbig small{font-size:12px;color:var(--ink2);font-weight:600;line-height:1.4}

function mascot(size=120,mood='happy',outfit=null,cls=''){
  if(mood==='happy'&&outfit&&outfit===S.outfit) mood=S.face||'happy';
  if(!BEAR[mood]) mood='happy';
  const o=outfit||{}; const id='m'+(gid++);
  const lay=slot=>o[slot]&&ITEMS[o[slot]]?ITEMS[o[slot]].svg(id+slot):'';
  const capeFront=o.back&&ITEMS[o.back]&&ITEMS[o.back].front?ITEMS[o.back].front():'';
  return `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 120 120" style="overflow:visible">
    <ellipse cx="60" cy="116.5" rx="24" ry="3.4" fill="#2F6BFF" opacity=".16"/>
    ${o.back&&ITEMS[o.back]&&ITEMS[o.back].raw?lay('back'):`<g transform="translate(60.9 58) scale(.72 1.15) translate(-60 -66)">${lay('back')}</g>`}
    <image href="${BEAR[mood]}" x="19.7" y="2" width="81.81" height="116" preserveAspectRatio="xMidYMid meet"/>
    ${lay('body')}
    <g transform="translate(60.9 60.4) scale(.66) translate(-60 -90)">${capeFront}${lay('neck')}</g>
    <g transform="translate(60.6 40.6) scale(.64) translate(-60 -62)">${lay('face')}</g>
    <g transform="translate(60.9 12.8) scale(.76) translate(-60 -24)"><g transform="translate(60 40) scale(1.16) translate(-60 -43)">${lay('hat')}</g></g>
  </svg>`;
}

const NUM=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function norm(s){
  s=(s||'').toLowerCase().replace(/[’‘`]/g,"'").replace(/\$(\d+)/g,'$1 dollars').replace(/(\d+):00/g,'$1');
  s=s.replace(/\b(\d+)\b/g,(m,n)=>{n=+n;if(n<=20)return NUM[n];if(n<100)return TENS[Math.floor(n/10)]+(n%10?' '+NUM[n%10]:'');return m;});
  s=s.replace(/\bi'm\b/g,'i am').replace(/'re\b/g,' are').replace(/n't\b/g,' not').replace(/'ll\b/g,' will').replace(/'ve\b/g,' have').replace(/'d\b/g,' would').replace(/'s\b/g,' is');
  return s.replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function sdx(w){ const c={b:1,f:1,p:1,v:1,c:2,g:2,j:2,k:2,q:2,s:2,x:2,z:2,d:3,t:3,l:4,m:5,n:5,r:6}; let o=w[0]||'',prev=c[w[0]]||0; for(const ch of w.slice(1)){const v=c[ch]||0;if(v&&v!==prev)o+=v;prev=v;} return (o+'000').slice(0,4); }
const near=(a,b)=>a===b||(a.length>3&&lev(a,b)<=1)||(a.length>2&&sdx(a)===sdx(b))||(a.length>4&&lev(a,b)<=2);
function sayPassOne(target,said){
  const T=norm(target).split(' ').filter(Boolean), W=norm(said).split(' ').filter(Boolean);
  if(!W.length) return false;
  if(T.length===1){ const t=T[0]; const cands=[...W,W.join('')]; let best=0;
    for(const x of cands){ if(near(t,x)) return true; best=Math.max(best,1-lev(t,x)/Math.max(t.length,x.length)); } return best>=0.5; }
  const m=T.length,n=W.length,dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=near(T[i-1],W[j-1])?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  return dp[m][n]/m>=0.5; // 절반 이상 비슷하면 통과 (아예 다른 말만 다시)
}
const sayPass=(target,said,alts)=>[said,...(alts||[])].some(x=>sayPassOne(target,x));

// ---------- 플레이 엔진 ----------
// 워디는 하트·벌칙이 없어요. 틀리면 힌트로 끝까지 도와줘요.
const KIND_OK=['괜찮아요! 다시 골라 봐요 💙','틀려도 괜찮아요, 한 번 더! 🐻','거의 다 왔어요! 다시 해 봐요','실수는 배우는 중이라는 뜻이에요 💪'];
let RUN=null;
function startLevel(i,review){
  const lv=buildLevel(S.tier,S.sec,i);
  RUN={mode:'level',i:0,lvl:i,acts:lv.acts,sample:lv.sample,review:!!review,first:0,key:SK()};
  playScreen();
}
function startTest(){ RUN={mode:'test',i:0,acts:buildTest(),correct:0}; playScreen(); }
function playScreen(){
  setScreen(`<div class="play"><div class="ptop"><button class="iconbtn" onclick="quitRun()">${I.x}</button><div class="progress"><i id="pbar"></i></div><span class="cnt" id="pcnt"></span></div>
    <div class="pbody" id="pbody"></div><div class="pfoot" id="pfoot"></div></div>`);
  renderAct();
}
function quitRun(){ confirmBox('그만할까요?',RUN.mode==='test'?'지금 나가면 테스트 결과가 저장되지 않아요.':'지금 나가면 이번 레벨 진행이 저장되지 않아요.<br>사용한 포인트는 그대로라 다시 도전할 때 또 내지 않아요.','나가기',()=>{RUN=null;go('home');}); }
function renderAct(){
  micAbort();
  const a=RUN.acts[RUN.i]; a.tries=0;
  $('#pbar').style.width=(RUN.i/RUN.acts.length*100)+'%'; $('#pcnt').textContent=`${RUN.i+1}/${RUN.acts.length}`;
  const head=`<span class="akind">${KINDS[a.kindLabel||a.k]}</span>${RUN.mode==='test'?' <span class="akind" style="background:#FFF3D6;color:#B07A00">레벨 테스트</span>':''}`;
  const body=$('#pbody'), foot=$('#pfoot'); foot.innerHTML='';
  const lbtn=(t)=>`<div class="listen-row">${bearWith('🎧',92,'happy')}<button class="listen-big" onclick="speak(${esc(JSON.stringify(t))})">${I.spk.replace('<svg','<svg width="46" height="46"')}</button></div><div style="display:flex;justify-content:center;margin:-6px 0 18px"><button class="pbtn alt" onclick="speak(${esc(JSON.stringify(t))},true)">🐢 천천히</button></div>`;
  if(a.k==='pic'){
    body.innerHTML=`${head}<div class="aq">그림에 맞는 단어를 골라요</div><div class="picbox">${a.em}<span class="peek">${W(78,'joy')}</span></div><div class="g2">${a.opts.map(o=>`<button class="opt en" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    bindChoice('.opt',a.ans);
  } else if(a.k==='sit'){
    body.innerHTML=`${head}<div class="aq">상황에 맞는 말을 골라요</div><div class="scene">${bearWith(a.em)}<p>${esc(a.q)}</p></div><div class="opts">${a.opts.map(o=>`<button class="opt en" style="justify-content:flex-start;font-size:16px" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
    bindChoice('.opt',a.ans);
  } else if(a.k==='listenPic'){
    body.innerHTML=`${head}<div class="aq">들리는 단어에 맞는 그림을 골라요</div>${lbtn(a.w)}<div class="g2">${a.opts.map(o=>`<button class="optE" data-v="${o}">${o}</button>`).join('')}</div>`;
    bindChoice('.optE',a.ans); setTimeout(()=>speak(a.w),350);
  } else if(a.k==='minimal'){
    body.innerHTML=`${head}<div class="aq">들리는 단어를 골라요</div>${lbtn(a.w)}<div class="g2">${a.opts.map(o=>`<button class="opt en" style="flex-direction:column;gap:2px;padding:14px 8px" data-v="${esc(o[0])}">${esc(o[0])}<small style="font:600 12px 'Noto Sans KR';color:var(--muted)">${esc(o[1])}</small></button>`).join('')}</div>
      <div class="hint-box" style="margin-top:16px;font-size:13px">💡 ${esc(a.how)}</div>`;
    bindChoice('.opt',a.w); setTimeout(()=>speak(a.w),350);
  } else if(a.k==='pair'){
    const L=shuffle(a.pairs.map((p,k)=>({t:p[0],k}))), R=shuffle(a.pairs.map((p,k)=>({t:p[1],k})));
    body.innerHTML=`${head}<div class="aq">${esc(a.pl)}</div><div class="pairs"><div class="col">${L.map(x=>`<button class="pt en" data-s="L" data-k="${x.k}">${esc(x.t)}</button>`).join('')}</div><div class="col">${R.map(x=>`<button class="pt ${/[a-z]/i.test(x.t)?'en':''}" data-s="R" data-k="${x.k}">${esc(x.t)}</button>`).join('')}</div></div>`;
    bindPair(a);
  } else if(a.k==='sayW'||a.k==='sayS'){
    const tgt=a.k==='sayW'?a.w:a.en;
    body.innerHTML=`${head}<div class="aq">${a.k==='sayW'?'단어를 듣고 따라 말해요':'문장을 듣고 따라 말해요'}</div><div class="say-card"><div style="display:flex;justify-content:center">${bearWith(a.em||'🎙',110,a.k==='sayW'?'joy':'happy')}</div><div class="${a.k==='sayW'?'w':'s'}">${esc(tgt)}</div><div class="k">${esc(a.ko)}</div>${a.how?`<div class="hint-box" style="margin:14px 0 0;font-size:13px;text-align:left">💡 ${esc(a.how)}</div>`:''}
      <div class="play-row"><button class="pbtn" onclick="speak(${esc(JSON.stringify(tgt))})">${I.spk}다시 듣기</button><button class="pbtn alt" onclick="speak(${esc(JSON.stringify(tgt))},true)">🐢 천천히</button></div></div>`;
    foot.innerHTML=`<div class="micwrap"><div class="mic-live" id="micLive">소리를 들은 뒤 마이크를 눌러 따라 말해요</div><button class="mic big" id="micBtn">${I.mic}</button><div class="mic-sub" id="micSub">눌러서 말하기</div><div id="micMore"></div></div>`;
    $('#micBtn').onclick=()=>micToggle((said,alts,err)=>onSaid(a,tgt,said,alts,err));
    if(RUN.mode==='test') $('#micMore').innerHTML=`<button class="linkbtn" onclick="testNext(false)">말하기 건너뛰기</button>`;
    setTimeout(()=>speak(tgt),350);
  } else if(a.k==='spell'){
    a.ansArr=[...a.w]; a.bank=shuffle(a.ansArr.map((c,k)=>({c,k})));
    body.innerHTML=`${head}<div class="aq">들리는 단어를 블록으로 만들어요</div>${lbtn(a.w)}<div class="kohint">뜻: ${esc(a.ko)}</div><div class="slots" id="slots"></div><div class="blocks" id="bank"></div>`;
    a.pick=[]; drawSpell(a); tileFoot(a); setTimeout(()=>speak(a.w),350);
  } else if(a.k==='order'||a.k==='build'){
    a.ansArr=a.en.replace(/[.!?]$/,'').split(' '); a.bank=shuffle(a.ansArr.map((c,k)=>({c,k}))); a.pick=[];
    body.innerHTML=`${head}<div class="aq">${a.k==='order'?'뜻에 맞게 단어를 순서대로 놓아요':'들리는 문장을 단어로 만들어요'}</div>
      ${a.k==='order'?`<div class="scene">${bearWith('💬',74,'happy')}<p>${esc(a.ko)}</p></div>`:lbtn(a.en)}
      <div class="ans" id="ans"></div><div class="bank" id="bank"></div>`;
    drawTiles(a); tileFoot(a); if(a.k==='build') setTimeout(()=>speak(a.en),350);
  }
}
// 객관식
function bindChoice(sel,ans){
  const a=RUN.acts[RUN.i];
  document.querySelectorAll(sel).forEach(b=>b.onpointerdown=()=>{
    if(a.locked) return; const ok=b.dataset.v===ans; if(a.k==='pic'||a.k==='minimal'||a.k==='sit') speakFast(b.dataset.v); if(a.snd&&!a.tracked){ a.tracked=1; track(a.snd,ok); }
    if(RUN.mode==='test'){ a.locked=true; b.classList.add(ok?'ok':'no'); if(!ok) document.querySelectorAll(sel).forEach(x=>{if(x.dataset.v===ans)x.classList.add('ok')}); return testNext(ok); }
    if(ok){ a.locked=true; b.classList.add('ok'); if(a.tip) toast(a.tip); clearAct(a.tries?'정답이에요':'한 번에 정답!',a.tip?'':'',a.tip?1900:1150); }
    else { a.tries++; if(a.tries===1) toast(KIND_OK[Math.floor(Math.random()*KIND_OK.length)]); b.classList.add('no','shake'); b.disabled=true; if(a.k==='listenPic') setTimeout(()=>speak(a.w),300); }
  });
}
// 짝꿍
function bindPair(a){
  let sel=null, left=a.pairs.length, miss=0;
  document.querySelectorAll('.pt').forEach(b=>b.onpointerdown=()=>{
    if(b.classList.contains('done')) return;
    if(/[a-z]/i.test(b.textContent)) speakFast(b.textContent);
    if(!sel||sel.dataset.s===b.dataset.s){ if(sel) sel.classList.remove('sel'); sel=b; b.classList.add('sel'); return; }
    const Lb=sel.dataset.s==='L'?sel:b, Rb=sel.dataset.s==='L'?b:sel;
    if(a.pairs.some(p=>p[0]===Lb.textContent&&p[1]===Rb.textContent)){ [sel,b].forEach(x=>{x.classList.remove('sel');x.classList.add('done')}); sel=null; if(--left===0) clearAct(miss?'짝꿍을 모두 찾았어요':'실수 없이 완벽해요!'); }
    else { miss++; const s=sel; [s,b].forEach(x=>{x.classList.add('bad','shake')}); setTimeout(()=>[s,b].forEach(x=>x.classList.remove('bad','shake','sel')),450); sel=null; }
  });
}
// 블록 · 타일
function drawSpell(a){
  const COL=['#2F6BFF','#0EA5E9','#22B39C','#FFB020','#FF7A59','#8B5CF6'];
  $('#slots').innerHTML=a.ansArr.map((_,k)=>{const p=a.pick[k];return `<div class="slot ${p?'f':''}" data-k="${k}">${p?esc(p.c):''}</div>`}).join('');
  $('#bank').innerHTML=a.bank.map((x,k)=>`<button class="blk ${a.pick.includes(x)?'used':''}" style="background:${COL[k%COL.length]}" data-k="${k}">${esc(x.c)}</button>`).join('');
  document.querySelectorAll('#bank .blk').forEach(b=>b.onpointerdown=()=>{ if(a.pick.length>=a.ansArr.length) return; a.pick.push(a.bank[+b.dataset.k]); drawSpell(a); tileFoot(a); });
  document.querySelectorAll('#slots .slot.f').forEach(s=>s.onpointerdown=()=>{ a.pick.splice(+s.dataset.k,1); drawSpell(a); tileFoot(a); });
}
function drawTiles(a){
  $('#ans').innerHTML=a.pick.map((x,k)=>`<button class="tile ${a.mark&&a.mark[k]?'right':''}" data-k="${k}">${esc(x.c)}</button>`).join('')||'<span style="color:var(--muted);font-size:13px;padding:14px 4px">아래 단어를 눌러 문장을 만들어요</span>';
  $('#bank').innerHTML=a.bank.map((x,k)=>`<button class="tile ${a.pick.includes(x)?'used':''}" data-k="${k}">${esc(x.c)}</button>`).join('');
  document.querySelectorAll('#bank .tile').forEach(b=>b.onpointerdown=()=>{ const x=a.bank[+b.dataset.k]; if(a.pick.includes(x)) return; a.pick.push(x); a.mark=null; speakFast(x.c); drawTiles(a); tileFoot(a); });
  document.querySelectorAll('#ans .tile').forEach(b=>b.onpointerdown=()=>{ a.pick.splice(+b.dataset.k,1); a.mark=null; drawTiles(a); tileFoot(a); });
}
function speakWord(w){ if(TTS){ speak(w); return; } try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(w); u.lang='en-US'; const v=pickVoice(); if(v)u.voice=v; speechSynthesis.speak(u);}catch(e){} }
function tileFoot(a){
  const full=a.pick.length===a.ansArr.length;
  $('#pfoot').innerHTML=`<div class="footrow"><button class="btn btn-soft" style="flex:0 0 96px" ${a.pick.length?'':'disabled'} id="tClr">지우기</button><button class="btn btn-primary" ${full?'':'disabled'} id="tOk">확인</button></div>`;
  $('#tClr').onclick=()=>{ a.pick=[]; a.mark=null; a.k==='spell'?drawSpell(a):drawTiles(a); tileFoot(a); };
  $('#tOk').onclick=()=>checkTiles(a);
}
function checkTiles(a){
  const user=a.pick.map(x=>x.c), ans=a.ansArr, isSp=a.k==='spell';
  const ok=isSp?user.join('').toLowerCase()===ans.join('').toLowerCase():user.map(norm).join(' ')===ans.map(norm).join(' ');
  const full=isSp?a.w:a.en;
  if(RUN.mode==='test'){ if(!ok) toast('정답: '+esc(full)); return testNext(ok); }
  if(ok){ if(!isSp) $('#ans').classList.add('ok'); else $('#slots').classList.add('ok'); $('#pfoot').innerHTML=''; if(a.k==='build') speak(a.en); clearAct(a.tries?'맞혔어요':'한 번에 정답!'); return; }
  a.tries++;
  // 비슷한지 / 아예 다른지 판단해서 힌트 창
  let sim, lines;
  if(isSp){
    const u=user.join('').toLowerCase(), t=ans.join('').toLowerCase(), d=lev(u,t), pos=ans.filter((c,k)=>c.toLowerCase()===(user[k]||'').toLowerCase()).length;
    sim = d<=Math.max(1,Math.round(t.length*0.4)) || pos/t.length>=0.5;
    lines = sim?`<b>철자 ${Math.max(1,t.length-pos)}개 위치만 바꾸면 돼요.</b><br>제자리에 있는 글자: ${pos}/${t.length}개`
               :`<b>처음부터 다시 들어 볼까요?</b><br>첫 글자는 <span class="en">'${esc(ans[0])}'</span>로 시작해요.`;
  } else {
    const mark=ans.map((w,k)=>norm(w)===norm(user[k]||'')), pos=mark.filter(Boolean).length, r=pos/ans.length;
    let adj=false; for(let k=0;k<ans.length-1;k++){ if(!mark[k]&&!mark[k+1]&&norm(user[k])===norm(ans[k+1])&&norm(user[k+1])===norm(ans[k])) adj=true; }
    sim = r>=0.5 || adj;
    if(sim){ a.mark=mark; drawTiles(a); lines=`<b>${ans.length}개 중 ${pos}개 단어가 제자리에 있어요.</b><br>${adj?'붙어 있는 두 단어의 순서가 바뀌었어요.':'초록색 단어는 맞았어요. 나머지 순서만 바꿔 봐요.'}`; }
    else lines=`<b>문장의 시작부터 다시 생각해 봐요.</b><br>첫 단어는 <span class="en">'${esc(ans[0])}'</span>예요.${a.k==='build'?' 천천히 듣기도 눌러 보세요.':''}`;
  }
  const d=sheet(`<div class="hint-em">${sim?'👀':'🙅'}</div><div class="hint-t ${sim?'sim':'diff'}">${sim?'비슷해요!':'많이 달라요'}</div>
    <div class="hint-box">${lines}<br><span style="font-size:12.5px;color:var(--muted)">내가 만든 답: </span><span class="en">${esc(isSp?user.join(''):user.join(' '))}</span></div>
    <button class="btn btn-primary" id="hRe">다시 해 볼게요</button>${a.tries>=2?`<button class="btn btn-ghost" id="hAns">정답 보고 넘어가기</button>`:''}`,false);
  d.querySelector('#hRe').onclick=()=>{ d.remove();
    const okAt=k=>isSp?(user[k]||'').toLowerCase()===ans[k].toLowerCase():norm(user[k]||'')===norm(ans[k]);
    let p=0; if(sim) while(p<ans.length&&okAt(p)) p++;
    a.pick=a.pick.slice(0,p); a.mark=isSp?null:a.pick.map(()=>true);
    isSp?drawSpell(a):drawTiles(a); tileFoot(a); if(a.k!=='order') speak(full,true); };
  const ha=d.querySelector('#hAns'); if(ha) ha.onclick=()=>{ d.remove(); const used=new Set();
    a.pick=ans.map(c=>{const x=a.bank.find(b=>!used.has(b)&&b.c===c); used.add(x); return x;}); a.mark=null;
    isSp?drawSpell(a):drawTiles(a); (isSp?$('#slots'):$('#ans')).classList.add('ok'); $('#pfoot').innerHTML=''; speak(full); clearAct('정답을 확인했어요','soft',1800); };
}
// 발음 결과
function onSaid(a,tgt,said,alts,err){
  if(!said){
    if(err&&/not.?allowed|not_granted|no-api|service|audio-capture|start/.test(err)) return noMicFallback(a,err);
    live(err==='stall'?'마이크가 잠깐 멈췄어요. 한 번 더 눌러 주세요 🙏':'잘 못 들었어요 🙉 마이크를 다시 눌러 말해 주세요'); return;
  }
  let pass=sayPass(tgt,said,alts);
  if(a.partner){ const all=[said,...(alts||[])].map(x=>norm(x).split(' ')); const T=norm(tgt), P=norm(a.partner);
    const hitT=all.some(w=>w.includes(T)), hitP=all[0].includes(P);
    pass=hitT||(!hitP&&pass);
    if(!a.tracked){ a.tracked=1; track(a.snd,pass); }
    if(!pass&&hitP){ a.tries++; live(`조금 다르게 들렸어요 🙉<br><b>${esc(a.how)}</b>`); if(a.tries>=2) $('#micMore').innerHTML=`<button class="linkbtn" onclick="clearAct('다음에 다시 연습해요','soft')">이번엔 넘어가기</button>`; speak(tgt,true); return; } }
  if(RUN.mode==='test'){ live(''); return testNext(pass); }
  if(pass){ live('잘했어요! 👏'); $('#micBtn').disabled=true; clearAct('발음 통과!'); return; }
  a.tries++;
  live('조금 다르게 들렸어요 🙉<br>한 번 더 듣고 마이크를 눌러 말해 봐요');
  if(a.tries>=2) $('#micMore').innerHTML=`<button class="linkbtn" onclick="clearAct('다음에 다시 연습해요','soft')">이번엔 넘어가기</button>`;
  speak(tgt,true);
}
function noMicFallback(a,err){
  live(`이 화면에서는 발음 인식을 쓸 수 없어요<br><span style="font-size:12px;color:var(--muted)">(${esc(err)}) · 앱·크롬·사파리에서 열면 인식돼요</span>`);
  $('#micMore').innerHTML=`<button class="btn btn-soft" style="padding:11px 18px;margin-top:4px" id="selfOk">🗣 따라 말했어요</button>`;
  $('#selfOk').onclick=()=>RUN.mode==='test'?testNext(false):clearAct('따라 말하기 완료','soft');
}
// CLEAR 점수판 → 다음 콘텐츠
function clearAct(sub,cls='',wait=1150){
  const a=RUN.acts[RUN.i]; if(a.cleared) return; a.cleared=true; if(!a.tries) RUN.first++;
  micAbort(); micUI();
  const f=document.createElement('div'); f.className='clear-board '+cls; f.innerHTML=`<div class="n">CLEAR!</div><div class="s">${sub}</div>`;
  $('.play').appendChild(f);
  setTimeout(()=>f.classList.add('out'),wait-300);
  const waitAudio=Promise.race([LAST.catch(()=>{}),new Promise(r=>setTimeout(r,3500))]);
  setTimeout(()=>{ f.remove(); waitAudio.then(()=>{ if(!RUN) return; RUN.i++; RUN.i>=RUN.acts.length?(RUN.mode==='bonus'?finishBonus():finishLevel()):renderAct(); }); },wait);
}
function testNext(ok){
  if(ok) RUN.correct++;
  const f=document.createElement('div'); f.className='clear-board '+(ok?'':'bad'); f.innerHTML=`<div class="n" style="font-size:34px">${ok?'정답':'오답'}</div><div class="s">${RUN.i+1}/${RUN.acts.length}</div>`;
  $('.play').appendChild(f); setTimeout(()=>f.classList.add('out'),650);
  setTimeout(()=>{ f.remove(); if(!RUN) return; RUN.i++; RUN.i>=RUN.acts.length?finishTest():renderAct(); },950);
}

// ---------- 레벨 완료 ----------
function finishLevel(){
  const r=RUN, key=r.key, i=r.lvl; RUN=null;
  let gained=0;
  if(!r.review){
    S.prog[key]=S.prog[key]||{}; S.prog[key][i]=dayNo(); S.xp+=LEVEL_XP; gained=LEVEL_XP;
    const t=dayNo(); if(S.lastDay!==t){ S.streak=S.lastDay===t-1?S.streak+1:1; S.lastDay=t; }
    if(doneCount(key)>=SEC_LEVELS) S.ticket=key;
    save();
  }
  const secDone=doneCount(key)>=SEC_LEVELS;
  setScreen(`<div class="res-big"><div class="emb" style="animation:pop .9s cubic-bezier(.2,1.6,.4,1) both;display:inline-block">${W(150,'joy')}</div>
    <h1>${r.review?'복습 완료!':`${S.sec+1}섹션 ${i+1}레벨 클리어!`}</h1>
    <p>${esc(lvTitle(S.tier,S.sec,i))}<br><span style="font-size:13px;color:var(--coral)">💙 틀려도 벌칙 없이, 힌트로 끝까지 해냈어요</span></p>
    <div class="res-stats"><div class="stat"><b class="en">${r.first}/${r.acts.length}</b><small>한 번에 정답</small></div><div class="stat"><b class="en">+${gained}</b><small>XP</small></div><div class="stat"><b class="en">${doneCount(key)}/14</b><small>섹션 진도</small></div></div>
    <div class="card" style="text-align:left;font-size:13.5px;line-height:1.6;color:var(--ink2)">${secDone?`🏆 <b style="color:var(--ink)">섹션을 모두 끝냈어요!</b><br>레벨 테스트에 다시 도전할 수 있어요. 승급하거나 다음 섹션으로 넘어가요.`:r.review?'복습은 진도와 XP에 반영되지 않아요.':`🌙 <b style="color:var(--ink)">다음 레벨은 내일 열려요</b><br>${untilMidnight()} 뒤 ${i+2}레벨 「${esc(lvTitle(S.tier,S.sec,i+1))}」에 도전할 수 있어요.`}</div>
    <button class="btn btn-primary" style="margin-top:18px" onclick="go('home')">홈으로</button>
    ${r.sample&&DEV?'<p style="font-size:12px;color:var(--muted)">※ 이 레벨은 프로토타입용 샘플 문제로 채워져 있어요</p>':''}</div>`);
}

function finishTest(){
  const c=RUN.correct, nt=tierFromScore(c), first=!S.tested, prev=S.tier; RUN=null;
  let msg;
  if(first){ S.tier=nt; S.sec=0; S.open[SK()]=1; S.tested=true; msg=`${TIERS[nt].ko} 1섹션부터 시작해요!`; }
  else if(nt>prev){ S.tier=nt; S.sec=0; S.open[SK()]=1; msg=`🎉 ${TIERS[prev].ko} → ${TIERS[nt].ko} 승급! ${TIERS[nt].ko} 1섹션이 무료로 열렸어요.`; }
  else msg=`지금 티어 <b>${TIERS[prev].ko}</b>를 유지해요. 다음 섹션으로 넘어가 실력을 더 쌓아요.`;
  S.bestTier=Math.max(S.bestTier||0,S.tier); S.ticket=null; save();
  setScreen(`<div class="result"><div class="emb">${emblem(first||nt>prev?nt:prev,150)}</div>

    <button class="btn btn-primary" style="margin-top:22px" onclick="go('home')">홈으로</button></div>`);

function tryLevel(i){
  const st=lvState(i);
  if(st==='done') return startLevel(i,true);
  if(st==='tomorrow') return spend(EARLY_COST,`내일 열리는 ${S.sec+1}섹션 ${i+1}레벨을 지금 바로 열고 도전`,()=>{ S.early[SK()+'-'+i]=1; S.paid[SK()+'-'+i]=1; save(); startLevel(i); });
  if(st==='locked') return toast('🔒 앞 레벨을 먼저 끝내야 해요');
  if(st==='pay') return spend(LEVEL_COST,`${S.sec+1}섹션 ${i+1}레벨 도전`,()=>{ S.paid[SK()+'-'+i]=1; save(); startLevel(i); });
  startLevel(i);
}
function nextSection(){
  if(S.sec+1>=CURR[S.tier].length) return toast('이 티어의 마지막 섹션이에요');
  spend(SECTION_COST,`${S.sec+2}섹션 「${CURR[S.tier][S.sec+1].n}」 열기`,()=>{ S.sec++; S.open[SK()]=1; if(S.ticket&&S.ticket!==SK()) S.ticket=null; save(); toast(`🎉 ${S.sec+1}섹션이 열렸어요!`); home(); });
}

// ---------- 학습 지도 ----------
let MAPT=null, MAPS=null;
function mapScreen(){
  if(MAPT==null){MAPT=S.tier;MAPS=S.sec;}
  const mine=MAPT===S.tier&&MAPS===S.sec, past=MAPT<S.tier||(MAPT===S.tier&&MAPS<S.sec), sec=CURR[MAPT][MAPS];
  const row=(ttl,i)=>{
    const st=mine?lvState(i):past?(prog(SK(MAPT,MAPS))[i]!=null?'done':'locked'):'locked';
    const sub={done:'완료 · 눌러서 복습',open:'오늘 도전!',pay:`오늘 도전 · 💎${LEVEL_COST}P`,tomorrow:`내일 열려요 · 💎${EARLY_COST}P로 바로`,locked:'앞 레벨을 끝내면 열려요'}[st];
    const right=st==='done'?`<span class="stamp">${mascot(30,'joy',S.outfit)}<i>참 잘했어요</i></span>`
      :st==='tomorrow'?`<span class="dic">${I.moon}</span>`:st==='locked'?`<span class="dic">${I.lock}</span>`:`<span class="dgo">${st==='pay'?'💎'+LEVEL_COST:'GO'}</span>`;
    return `<button class="dayc ${st}" onclick="nodeTap(${i},'${st}')"><span class="dnum"><small>DAY</small><b>${i+1}</b></span><span class="dtx"><b>${esc(ttl)}${i===13?' <em>복습</em>':''}</b><small>${sub}</small></span>${right}</button>`;
  };
  const pr=prog(SK(MAPT,MAPS)), wd=w=>[0,1,2,3,4,5,6].filter(k=>pr[w*7+k]!=null).length;
  const nodes=[0,1].map(w=>`<div class="wk"><div class="wkh"><b>${w+1}주차</b><span>${mine||past?`${wd(w)}/7 완료`:'미리 보기'}</span></div>${sec.lv.slice(w*7,w*7+7).map((t,k)=>row(t,w*7+k)).join('')}</div>`).join('');
  setScreen(`<div class="top"><h2>학습 지도</h2><span class="label">${TIERS[MAPT].en}</span></div>
    <div class="chips">${TIERS.map((t,k)=>`<button class="chip ${k===MAPT?'on':''}" onclick="MAPT=${k};MAPS=${k===S.tier?S.sec:0};mapScreen()">${k>S.tier?'🔒 ':''}${t.ko}</button>`).join('')}</div>
    <div class="chips" style="padding-top:0">${CURR[MAPT].map((s,k)=>`<button class="chip ${k===MAPS?'on':''}" style="${k===MAPS?'background:var(--coral);border-color:var(--coral)':''}" onclick="MAPS=${k};mapScreen()">${k+1}섹션 · ${esc(s.n)}</button>`).join('')}</div>
    <div class="sec-card">${emblem(MAPT,58)}<div style="flex:1"><small>${TIERS[MAPT].ko} · ${MAPS+1}섹션 · 2주 플래너</small><b>${esc(sec.n)}</b>
      <div class="xpbar"><i style="width:${doneCount(SK(MAPT,MAPS))/14*100}%"></i></div></div></div>

  const it=ITEMS[k], un=itemUnlocked(k), on=S.outfit[it.slot]===k;

}
function closet(){
  S.outfit=S.outfit||{}; S.owned=S.owned||{};
  const all=Object.keys(ITEMS);
  const filt=k=>closetSlot==='all'||(closetSlot==='shop'?ITEMS[k].price!=null:closetSlot==='tier'?ITEMS[k].tier!=null:ITEMS[k].slot===closetSlot);

  const y0=$('#screen')?$('#screen').scrollTop:0;

    <div style="font-size:13px;color:var(--ink2);margin-top:4px">${Object.values(S.outfit).filter(Boolean).map(k=>ITEMS[k]?ITEMS[k].ko:'').filter(Boolean).join(' · ')||'아무것도 입지 않았어요'}</div>

  <div class="label" style="padding:16px 20px 8px">표정</div>
  <div class="chips">${Object.entries(FACES).map(([k,l])=>`<button class="chip ${(S.face||'happy')===k?'on':''}" style="display:flex;align-items:center;gap:6px;padding:5px 12px 5px 6px" onclick="S.face='${k}';save();closet(true)">${mascot(30,k)}${l}</button>`).join('')}</div>

  ${shopK.length?`<div class="sec-h"><span>🛍️ 포인트 상점</span><span style="color:var(--muted);font-weight:600">${shopK.length}개 상품</span></div>

    <div style="flex:1;font-size:13px;line-height:1.45"><b style="font-size:16px">💎 ${S.points||0}P 보유</b><br><span style="color:var(--ink2)">광고 1회 +${AD_POINT}P · 오늘 ${adLeft()}회 남음</span></div>
    <button class="btn btn-primary" style="width:auto;padding:12px 14px;font-size:14px;white-space:nowrap" onclick="go('reward')">포인트 받으러 가기 →</button></div>
  <div class="items">${shopK.map(itemCard).join('')}</div>`:''}
  ${tierK.length?`<div class="sec-h"><span>🏆 티어 상징 아이템</span><span style="color:var(--muted);font-weight:600">레벨테스트로 획득</span></div><div class="items">${tierK.map(itemCard).join('')}</div>`:''}

  if(arguments[0]) $('#screen').scrollTop=y0;
}
function wear(k){
  const it=ITEMS[k];
  if(!itemUnlocked(k)){
    if(it.tier!=null){ toast(`🔒 ${TIERS[it.tier].ko} 티어를 달성하면 받을 수 있어요`); return; }
    if((S.points||0)>=it.price){
      confirmBox(`${it.ko} 구매`,`<span style="display:block;text-align:center">${mascot(90,S.face||'happy',{[it.slot]:k})}</span>💎 <b>${it.price}P</b>(광고 약 ${itemDays(k)}일치)를 사용해 구매할까요?<br>보유 포인트: ${S.points}P → ${S.points-it.price}P`,'구매하기',()=>{
        S.points-=it.price; S.owned[k]=1; S.outfit[it.slot]=k; save(); closet(true); toast(`구매 완료! 워디가 ${it.ko}를 착용했어요 🎉`);
      });
    } else {
      confirmBox('포인트가 부족해요',`필요 💎 <b>${it.price}P</b> · 보유 ${S.points||0}P<br>${it.price-(S.points||0)}P가 더 필요해요. 광고를 보고 포인트를 모아 보세요!`,'포인트 받으러 가기',()=>go('reward'));
    }
    return;
  }
  S.outfit[it.slot]=S.outfit[it.slot]===k?null:k; save(); closet(true);
}

      <button onclick="S.points+=50;save();me();toast('💎 +50P')">포인트 +50P <span>지금 ${S.points}P</span></button>
      <button onclick="devFinishSec()">이번 섹션 바로 완료 <span>테스트 열기</span></button>
      <button onclick="confirmBox('처음부터 다시','모든 기록을 지우고 처음 화면으로 돌아가요.','초기화',()=>{try{localStorage.removeItem(LS)}catch(e){}location.reload()})">처음부터 다시 <span>초기화</span></button></div>`:''}
    <div style="text-align:center;margin:28px 0 8px;color:var(--muted);font-size:12px;line-height:1.7"><b class="en" style="font-size:16px;color:var(--coral);letter-spacing:.06em">WORDY</b><br>하루 한 레벨, 워디와 챌린지.<br>문의 support.wordy@gmail.com</div>
  </div>`,'me');
}
// 학습 초기화: 학습 기록만 지우고 포인트·워디 꾸미기·이름은 그대로
function resetLearning(){
  const d=sheet(`<div style="text-align:center">${W(90,'wow')}</div><h3 style="text-align:center">학습을 초기화할까요?</h3>
    <p style="text-align:center"><b style="color:var(--red)">학습과 관련된 모든 정보가 초기화됩니다.</b><br>되돌릴 수 없어요.</p>
    <div class="hint-box" style="font-size:13px;line-height:1.7">🗑 <b>초기화돼요</b> · 티어, 섹션·레벨 진도, XP, 연속 학습일, 레벨 테스트 결과, 발음 클리닉 기록<br>💎 <b>그대로 남아요</b> · 포인트, 워디 꾸미기(산 아이템·입은 옷·받은 망토), 이름</div>
    <div style="display:flex;gap:10px"><button class="btn btn-soft" id="rNo">취소</button><button class="btn btn-primary" style="background:var(--red);box-shadow:none" id="rOk">초기화하기</button></div>`);
  d.querySelector('#rNo').onclick=()=>d.remove();
  d.querySelector('#rOk').onclick=()=>{
    d.remove();
    S.bestTier=Math.max(S.bestTier||0,S.tested?S.tier:0);
    Object.assign(S,{tested:false,tier:0,sec:0,xp:0,prog:{},paid:{},open:{'0-0':1},ticket:null,early:{},streak:0,lastDay:-1,clinic:{}});
    save(); toast('학습 기록을 초기화했어요'); go('testIntro');
  };
}
function envInfo(){
  let vs=0; try{ vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).length; }catch(e){}
  const dev=IS_APP?'갤럭시 앱(APK)':IS_IOS?'아이폰·아이패드':/Android/i.test(UA)?'안드로이드 브라우저':'PC';
  const rec=DICT?'✅ Claude 받아쓰기':NATIVE?'✅ 휴대폰 음성 인식(앱)':SR?(IN_CLAUDE&&!DICT?'⚠️ 있지만 Claude 화면 안에서는 마이크가 막힐 수 있어요':'✅ 브라우저 음성 인식'):'❌ 없음 → "따라 말했어요" 버튼으로 진행';
  const tts=NATIVE?'✅ 휴대폰 음성(구글 TTS)':TTS?'✅ Claude 고품질 음성':AUDIO_MAP?'✅ 원어민 mp3 + 기기 음성':vs?`✅ 기기 음성 (영어 목소리 ${vs}개)`:'⚠️ 영어 목소리를 찾지 못했어요';
  return `<b>기기</b> ${dev}<br><b>듣기</b> ${tts}<br><b>말하기</b> ${rec}<br><span style="font-size:11.5px;color:var(--muted);word-break:break-all">${esc(UA.slice(0,140))}</span>`;
}
function devFinishSec(){ const k=SK(); S.prog[k]=S.prog[k]||{}; for(let i=0;i<SEC_LEVELS;i++) if(S.prog[k][i]==null) S.prog[k][i]=dayNo()-1; S.ticket=k; save(); toast('🧪 섹션 완료 처리했어요'); go('home'); }

// ---------- 시작 ----------
window.__wordyBack=function(){
  const m=document.querySelector('.ad-bg,.adweb,.modal-bg'); if(m){ if(!m.classList.contains('ad-bg')&&!m.classList.contains('adweb')) m.remove(); return true; }
  if(RUN){ quitRun(); return true; }
  if(!document.querySelector('.hero')&&S.onb){ go('home'); return true; }
  return false;
};
splash();
